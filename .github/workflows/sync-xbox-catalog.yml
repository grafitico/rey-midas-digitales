name: Sync Xbox catalog from Microsoft APIs

# Descarga el catálogo de Xbox (mercado Turquía) combinando:
#   1. SIGLs del catálogo Game Pass (IDs directos)
#   2. Listas computadas de Microsoft Store (reco-public): top pagos/gratis,
#      mejor valorados, nuevos, ofertas, próximos — catálogo comprable amplio.
# La generación (Xbox One / Series X|S) se deriva de los datos del producto.
#
# Commitea el JSON resultante en xbox-catalog.json.
# Schedule: 5am UTC diario ≈ 11pm Costa Rica.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      reco_count:
        description: "Items a pedir por lista computada de Microsoft Store"
        required: false
        default: "1000"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Sync Xbox catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          RECO_COUNT: ${{ inputs.reco_count || '1000' }}
        run: node scripts/sync-xbox-catalog.js
