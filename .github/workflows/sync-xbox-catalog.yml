name: Sync Xbox catalog from Microsoft APIs

# Descarga el catálogo completo de Xbox (mercado Turquía) combinando:
#   1. SIGLs del catálogo Game Pass (IDs directos)
#   2. catalog.gamepass.com/browse paginado por plataforma (XboxSeriesX|S, XboxOne)
#   3. Páginas HTML del Xbox Store turco (__NEXT_DATA__): deals, new, coming-soon
#
# Commitea el JSON resultante en xbox-catalog.json.
# Schedule: 5am UTC diario ≈ 11pm Costa Rica.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      browse_pages:
        description: "Páginas de browse por plataforma (XboxSeriesX|S y XboxOne)"
        required: false
        default: "80"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Sync Xbox catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          BROWSE_PAGES: ${{ inputs.browse_pages || '80' }}
        run: node scripts/sync-xbox-catalog.js
