name: Harvest covers to Bana

# Cosecha las carátulas de los juegos featured (que dependen de RAWG),
# las sube a Bana Hosting y commitea covers.json al repo. Una vez cosechadas,
# el sitio las carga directo desde Bana y deja de gastar cupo de RAWG.
#
# Se dispara a mano (botón "Run workflow") o por schedule semanal para
# capturar los juegos nuevos que se vayan agregando a featured-games.json.
#
# Requiere estos secrets del repo (Settings → Secrets and variables → Actions):
#   RAWG_API_KEY, BANA_HOST, BANA_USER, BANA_PASSWORD
#   BANA_PUBLIC_URL es opcional (se autodetecta si no se pone).

on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "URL pública de Bana (opcional, ej https://grafiticocr.com/covers). Vacío = autodetectar."
        required: false
        default: ""
  schedule:
    - cron: "30 6 * * 1"   # lunes 06:30 UTC

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install deps
        run: npm install basic-ftp@^5.0.5

      - name: Harvest covers
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          BANA_HOST: ${{ secrets.BANA_HOST }}
          BANA_USER: ${{ secrets.BANA_USER }}
          BANA_PASSWORD: ${{ secrets.BANA_PASSWORD }}
          BANA_PUBLIC_URL: ${{ inputs.public_url || secrets.BANA_PUBLIC_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: node scripts/harvest-covers.mjs
