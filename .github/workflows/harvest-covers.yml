name: Harvest covers to covers.json

# Busca la URL de portada de cada juego featured en RAWG (una sola vez),
# la guarda en covers.json y la commitea al repo.
# El sitio lee covers.json y carga las imágenes directo del CDN de RAWG
# (media.rawg.io) sin tocar la API nunca más → cero cuota en producción.
#
# Correr manualmente al inicio de cada mes (cuando se renueva la cuota RAWG)
# o cuando se agreguen juegos nuevos a featured-games.json.
#
# Solo requiere: RAWG_API_KEY en los secrets del repo.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 2 * *"   # día 2 de cada mes, 08:00 UTC (cuota ya renovada)

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Harvest cover URLs from RAWG
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: node scripts/harvest-covers.mjs
