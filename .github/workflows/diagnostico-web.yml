name: Diagnóstico web

# Visita reymidascr.com como lo hacen los robots de WhatsApp/Facebook y una
# persona normal, y muestra qué responde el servidor (código, cabeceras y las
# etiquetas de vista previa). Solo lee páginas públicas; se corre a mano desde
# Actions → Diagnóstico web → Run workflow.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Rutas a revisar, separadas por espacios"
        required: false
        default: "/ /combo/5000 /producto/feat-witcher-3 /api/og?path=/producto/feat-witcher-3 /hosting.txt"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Revisar
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          for p in $PATHS; do
            for ua in "WhatsApp/2.23.20.0 A" "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) Safari/604.1"; do
              echo "=================== $p  ·  ${ua:0:30}"
              curl -s -o body.html -D headers.txt -A "$ua" -w "HTTP %{http_code} · %{size_download} bytes · %{time_total}s\n" "https://reymidascr.com$p" || true
              grep -iE "^(server|content-type|x-prerender|cf-cache-status|location|x-powered-by):" headers.txt || true
              grep -oE '<title>[^<]*|property="og:(title|image|description)" content="[^"]{0,140}' body.html | head -4 || true
              head -c 200 body.html | tr '\n' ' '; echo
            done
            # Facebook manda cabeceras extra (Range, Accept, compresión): probar
            # cada una por separado para ver si alguna cambia el código.
            fb="facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"
            for h in "Range: bytes=0-524287" "Accept: */*" "Accept-Encoding: gzip, deflate, br" "Accept-Language: es-LA,es;q=0.9" "X-Forwarded-For: 66.220.149.1"; do
              curl -s -o /dev/null -A "$fb" -H "$h" -w "    [$h] HTTP %{http_code} · %{size_download} bytes\n" "https://reymidascr.com$p" || true
            done
            for lang in "es-LA,es;q=0.9" "en-US,en;q=0.9" "en_US" "es"; do
              for i in 1 2; do
                curl -s -o /dev/null -A "$fb" -H "Accept-Language: $lang" -w "    [lang $lang #$i] HTTP %{http_code} · %{size_download} bytes\n" "https://reymidascr.com$p" || true
              done
            done
            echo "    [HEAD]"; curl -s -I -A "$fb" "https://reymidascr.com$p" | grep -iE "^(HTTP|content-length|content-type|x-prerender)" | sed 's/^/      /' || true
            curl -s -o /dev/null -A "$fb" -H "Range: bytes=0-524287" -H "Accept: */*" -H "Accept-Encoding: deflate, gzip" -H "Accept-Language: en-US" -w "    [todas] HTTP %{http_code} · %{size_download} bytes\n" "https://reymidascr.com$p" || true
            curl -s -o /dev/null -A "$fb" -w "    [con ?fbclid] HTTP %{http_code} · %{size_download} bytes\n" "https://reymidascr.com$p?fbclid=abc123" || true
            curl -s -o /dev/null -A "$fb" -w "    [con / final] HTTP %{http_code} · %{size_download} bytes\n" "https://reymidascr.com$p/" || true
            curl -s -o /dev/null -A "$fb" -w "    [www] HTTP %{http_code} · %{size_download} bytes · %{redirect_url}\n" "https://www.reymidascr.com$p" || true
            curl -s -o /dev/null -A "facebookexternalhit/1.1" -w "    [UA corto] HTTP %{http_code}\n" "https://reymidascr.com$p" || true
            curl -s -o /dev/null -A "meta-externalagent/1.1" -w "    [meta-externalagent] HTTP %{http_code}\n" "https://reymidascr.com$p" || true
            # La portada que verían WhatsApp/Facebook: ¿descarga? ¿cuánto pesa?
            curl -s -o og.html -A "WhatsApp/2.23.20.0 A" "https://reymidascr.com$p" || true
            img=$(grep -oE 'property="og:image" content="[^"]+' og.html | head -1 | sed 's/.*content="//; s/&amp;/\&/g')
            if [ -n "$img" ]; then
              echo "--- og:image: ${img:0:150}"
              curl -s -o img.bin -A "WhatsApp/2.23.20.0 A" -w "    imagen: HTTP %{http_code} · %{content_type} · %{size_download} bytes · %{time_total}s\n" "$img" || true
              file img.bin | sed 's/^/    /'
            fi
          done

      # Lo que recibieron de verdad los robots (WhatsApp, Telegram, Facebook…)
      # en las últimas visitas a la app Node.js (server/app.mjs).
      - name: Últimas visitas de robots de vista previa
        run: |
          curl -s "https://reymidascr.com/api/og-log" | python3 -c '
          import json,sys
          d=json.load(sys.stdin); print("registro desde", d["desde"])
          for v in d["visitas"]:
              print(v["t"][11:19], v["st"], str(v["ms"])+"ms", v["m"], v["pais"], v["url"][:70], "|", v["ua"][:90], "| range:", v["range"])
          ' || true
