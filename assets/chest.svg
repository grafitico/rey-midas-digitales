<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Cofre de oro">
  <defs>
    <linearGradient id="chestWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5626"/>
      <stop offset="1" stop-color="#5a3414"/>
