  <circle cx="24" cy="19" r="3.6" fill="url(#chestGold)" stroke="#c8891b" stroke-width=".7"/>
  <circle cx="33" cy="20.5" r="3.4" fill="url(#chestGold)" stroke="#c8891b" stroke-width=".7"/>
  <!-- cuerpo -->
  <rect x="8" y="24" width="32" height="15.5" rx="2.5" fill="url(#chestWood)"/>
  <rect x="8" y="24" width="32" height="3.4" fill="url(#chestGold)"/>
  <rect x="21" y="24" width="6" height="15.5" fill="url(#chestGold)"/>
  <rect x="21.6" y="28.6" width="4.8" height="6" rx="1.2" fill="#c8891b"/>
